name: Refresh development notice directory

on:
  # GitHub 스케줄은 기본 브랜치에서 UTC로 실행한다. 00:17 UTC는 09:17 KST다.
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    # 환경의 배포 브랜치도 기본 브랜치로 제한하고 개발 작업자 비밀을 그 환경에 설정한다.
    # 출처 조건과 개발 연결을 확인한 뒤 저장소 변수 NOTICE_REFRESH_ENABLED를 true로 설정한다.
    if: >-
      github.repository == '95sionkim/HomeCierge' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.NOTICE_REFRESH_ENABLED == 'true'
    environment: notice-refresh-development
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: notice-refresh-development
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Collect and publish the notice directory
        env:
          APP_ENV: development
          SUPABASE_URL: ${{ secrets.NOTICE_REFRESH_SUPABASE_URL }}
          SUPABASE_WORKER_KEY: ${{ secrets.NOTICE_REFRESH_SUPABASE_WORKER_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.NOTICE_REFRESH_DATA_GO_KR_SERVICE_KEY }}
        run: python3 scripts/refresh_notice_index.py --live --publish
