<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1630" viewBox="0 0 2000 1630" role="img" aria-labelledby="title desc">
<title id="title">HomeCierge 프로세스 기반 에이전트 구성도</title><desc id="desc">구매조건 설정, 청약 기회 탐색, 가격과 자금 검증, 근거 설명, 청약 기회 알림의 다섯 단계와 총괄 에이전트의 판단 루프, API 도구, 메모리, Vercel 및 Colab 실행 경로. 주기 탐색과 알림은 확장 설계다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7b8ba2"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:#192b46}.title{font-size:39px;font-weight:700}.sub{font-size:20px;fill:#61718b}.h{font-size:24px;font-weight:700}.b{font-size:20px}.sm{font-size:17px;fill:#52647d}.tag{font-size:17px;font-weight:700;fill:#3268d7}.line{stroke:#7b8ba2;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}</style>
<rect width="2000" height="1630" fill="#f6f8fc"/>
<text x="60" y="65" class="title">HomeCierge · 나의 구매조건에서 기회 발견까지</text>
<text x="60" y="103" class="sub">프로세스 기반 Agent 설계 · 2026-11-13 · 실선: 초기 기능 설계 / 점선: 주기 탐색·알림 확장 / 구현 완료 아님</text><rect x="60" y="150" width="352" height="126" rx="16" fill="#eaf3ff" stroke="#d4deeb" stroke-width="2"/><text x="82" y="181" class="tag">01  Understand</text><text x="82" y="220" class="h">구매조건 설정</text><text x="82" y="252" class="sm">예산·지역·면적·입주 시점</text><path d="M412 213 H437" class="line"/><rect x="442" y="150" width="352" height="126" rx="16" fill="#eaf3ff" stroke="#d4deeb" stroke-width="2"/><text x="464" y="181" class="tag">02  Find</text><text x="464" y="220" class="h">청약 기회 탐색</text><text x="464" y="252" class="sm">충족 공고 / 확인 필요 분리</text><path d="M794 213 H819" class="line"/><rect x="824" y="150" width="352" height="126" rx="16" fill="#eaf3ff" stroke="#d4deeb" stroke-width="2"/><text x="846" y="181" class="tag">03  Verify</text><text x="846" y="220" class="h">가격·자금 검증</text><text x="846" y="252" class="sm">주변 실거래·납부 부족분</text><path d="M1176 213 H1201" class="line"/><rect x="1206" y="150" width="352" height="126" rx="16" fill="#eaf3ff" stroke="#d4deeb" stroke-width="2"/><text x="1228" y="181" class="tag">04  Explain</text><text x="1228" y="220" class="h">근거·주의사항 설명</text><text x="1228" y="252" class="sm">출처·가정·미확인·다음 행동</text><path d="M1558 213 H1583" class="line dash"/><rect x="1588" y="150" width="352" height="126" rx="16" fill="#f2ecfc" stroke="#9174ce" stroke-width="2" stroke-dasharray="8 6"/><text x="1610" y="181" class="tag">05  Alert</text><text x="1610" y="220" class="h">청약 기회 알림</text><text x="1610" y="252" class="sm">조건 충족·신규/변경·중복 확인</text><rect x="60" y="330" width="1880" height="145" rx="16" fill="#e6f3ee" stroke="#d4deeb" stroke-width="2"/><text x="85" y="366" class="h">LLM · 총괄 에이전트 1개 + 상태 기반 워크플로</text><text x="85" y="407" class="b">요청·승인 조건 확인 → 부족 근거 판단 → 도구 선택 → 수집·비교 적절성 검증 → 추가 조회 / 사용자 질문 / 보류 / 종료</text><text x="85" y="446" class="sm">계산·지역 확대·권한·승인·중복 판정은 코드가 통제 · 다섯 단계는 역할 구분이며 별도 멀티에이전트 운영을 뜻하지 않음</text><path d="M236 276 V330" class="line"/><path d="M618 276 V330" class="line"/><path d="M1000 276 V330" class="line"/><path d="M1382 276 V330" class="line"/><path d="M1764 276 V330" class="line dash"/><rect x="60" y="550" width="352" height="470" rx="16" fill="#fff" stroke="#d4deeb" stroke-width="2"/><path d="M236 475 V550" class="line"/><rect x="442" y="550" width="352" height="470" rx="16" fill="#fff" stroke="#d4deeb" stroke-width="2"/><path d="M618 475 V550" class="line"/><rect x="824" y="550" width="352" height="470" rx="16" fill="#fff" stroke="#d4deeb" stroke-width="2"/><path d="M1000 475 V550" class="line"/><rect x="1206" y="550" width="352" height="470" rx="16" fill="#fff" stroke="#d4deeb" stroke-width="2"/><path d="M1382 475 V550" class="line"/><rect x="1588" y="550" width="352" height="470" rx="16" fill="#faf6ff" stroke="#9174ce" stroke-width="2" stroke-dasharray="8 6"/><path d="M1764 475 V550" class="line dash"/><text x="80" y="582" class="tag">PROFILE · API / 승인</text><text x="80" y="612" class="h">조건 추출·변경안 생성</text><text x="80" y="642" class="sm">호출: 로그인·조건 입력 시</text><text x="80" y="672" class="b">Supabase Auth / Data API</text><text x="80" y="702" class="b">GET /api/v1/me</text><text x="80" y="732" class="b">decide_profile_change RPC</text><text x="80" y="762" class="sm"></text><text x="80" y="792" class="tag">입력</text><text x="80" y="822" class="b">시·군·구·예산 필수</text><text x="80" y="852" class="b">공급면적·입주 범위 선택</text><text x="80" y="882" class="b">상세 자금은 분석별 저장</text><text x="80" y="912" class="sm"></text><text x="80" y="942" class="tag">출력</text><text x="80" y="972" class="b">승인된 프로필·분석 조건</text><text x="462" y="582" class="tag">NOTICE · API / 문서</text><text x="462" y="612" class="h">공고·주택형·PDF 확보</text><text x="462" y="642" class="sm">호출: 수집·갱신 / 자료 누락</text><text x="462" y="672" class="b">청약홈 공고 조회</text><text x="462" y="702" class="sm">getAPTLttotPblancDetail</text><text x="462" y="732" class="sm">getRemndrLttotPblancDetail</text><text x="462" y="762" class="b">청약홈 주택형 조회</text><text x="462" y="792" class="sm">getAPTLttotPblancMdl</text><text x="462" y="822" class="sm">getRemndrLttotPblancMdl</text><text x="462" y="852" class="b">공식 상세 페이지 → 첨부 PDF</text><text x="462" y="882" class="sm">자동 확보 실패 → 업로드</text><text x="462" y="912" class="sm">LLM 추출 보조 + 원문 점검</text><text x="462" y="942" class="tag">주기 탐색: 별도 확장 설계</text><text x="462" y="972" class="sm">출력: 후보·미확인·가격 근거</text><text x="844" y="582" class="tag">COMPARE · API / Rule</text><text x="844" y="612" class="h">실거래·단지·자금 검증</text><text x="844" y="642" class="sm">호출: 선택 공고 분석·재분석</text><text x="844" y="672" class="b">국토부 매매 / 권리 거래</text><text x="844" y="702" class="sm">getRTMSDataSvcAptTradeDev</text><text x="844" y="732" class="sm">getRTMSDataSvcSilvTrade</text><text x="844" y="762" class="sm">카카오 /v2/local/search/address.json</text><text x="844" y="792" class="b">K-apt 목록 → 기본정보</text><text x="844" y="822" class="sm">getSigunguAptList4</text><text x="844" y="852" class="sm">getAphusBassInfoV5</text><text x="844" y="882" class="sm">건축HUB getBrTitleInfo</text><text x="844" y="912" class="sm">부족한 지역·월·페이지만 조회</text><text x="844" y="942" class="tag">자금·통계는 자체 계산</text><text x="844" y="972" class="sm">출력: 비교값·부족분·보류</text><text x="1226" y="582" class="tag">EVIDENCE · API / LLM</text><text x="1226" y="612" class="h">근거 수집·설명·보고서</text><text x="1226" y="642" class="sm">호출: 공고 조건·지역 확보 후</text><text x="1226" y="672" class="b">법령 lawSearch.do</text><text x="1226" y="702" class="sm">→ 시행 버전 → lawService.do</text><text x="1226" y="732" class="sm">NAVER API HUB /search/v1/news</text><text x="1226" y="762" class="sm">목적지·좌표 확인 후 경로 요청</text><text x="1226" y="792" class="sm">ODsay searchPubTransPathT</text><text x="1226" y="822" class="sm">자동차 경로 API: 미선정</text><text x="1226" y="852" class="tag">RAG: 채택 시 PDF·조항 검색</text><text x="1226" y="882" class="sm">페이지·버전·계정 범위 필터</text><text x="1226" y="912" class="sm">LLM 설명 ↔ 수치·인용 검사</text><text x="1226" y="942" class="tag">출력: 근거·주의·화면/PDF</text><text x="1226" y="972" class="sm">개인 자격·수익을 확정하지 않음</text><text x="1608" y="582" class="tag">MONITOR · 확장 제안</text><text x="1608" y="612" class="h">정기 탐색·알림 제어</text><text x="1608" y="642" class="sm">호출: 동의한 주기·변경 이벤트</text><text x="1608" y="672" class="b">Scheduler → Find 재실행</text><text x="1608" y="702" class="b">변경된 공고 → Verify 검증</text><text x="1608" y="732" class="b">조건 충족 → Explain 요약</text><text x="1608" y="762" class="b">중복/이전 발송 여부 확인</text><text x="1608" y="792" class="b">Notification Adapter → 발송</text><text x="1608" y="822" class="sm">알림 채널·제공 API: 미정</text><text x="1608" y="852" class="sm"></text><text x="1608" y="882" class="tag">필요한 추가 결정</text><text x="1608" y="912" class="b">수신 동의·주기·중복 기준</text><text x="1608" y="942" class="sm">정정 재알림·해지·실패 재시도</text><text x="1608" y="972" class="sm">실제 스케줄·알림 미활성화</text><rect x="60" y="1070" width="1880" height="122" rx="16" fill="#fff6e4" stroke="#d4deeb" stroke-width="2"/><text x="85" y="1106" class="h">검증 게이트 · LLM의 추측으로 통과시키지 않는 공통 규칙</text><text x="85" y="1142" class="b">같은 회차·호실 가격 + 필수 옵션  |  공급면적 ±5%·최근접 면적·최대 5단지  |  거래 종류별 통계·자체 거래 별도</text><text x="85" y="1174" class="sm">동·읍·면 우선 → 전체 정상 0개일 때만 상위 지역 확대 · 오류/미확인 시 보류 · 가격 차이를 보장된 안전마진·수익으로 표현하지 않음</text><path d="M1000 1020 V1070" class="line"/><rect x="60" y="1235" width="600" height="155" rx="16" fill="#edf3fe" stroke="#d4deeb" stroke-width="2"/><rect x="700" y="1235" width="600" height="155" rx="16" fill="#e9f6f1" stroke="#d4deeb" stroke-width="2"/><rect x="1340" y="1235" width="600" height="155" rx="16" fill="#fff" stroke="#d4deeb" stroke-width="2"/><text x="82" y="1272" class="h">서비스 실행 · Vercel</text><text x="82" y="1307" class="b">인증·요청 접수 → 공통 코어·작업 실행기</text><text x="82" y="1340" class="b">Supabase DB·Auth·비공개 Storage</text><text x="82" y="1370" class="sm">긴 작업의 실행 런타임·정기 탐색 배치는 미정</text><text x="722" y="1272" class="h">제출 실행 · Colab</text><text x="722" y="1307" class="b">같은 코어·프롬프트·도구 계약 직접 실행</text><text x="722" y="1340" class="b">고정 자료·로컬 저장 / 실제 LLM 모드</text><text x="722" y="1370" class="sm">알림 확장은 이벤트·중복·발송 대역으로 평가</text><text x="1362" y="1272" class="h">공통 메모리 · 계정별 분리</text><text x="1362" y="1307" class="b">승인 프로필 / 분석별 자금 / 작업·근거</text><text x="1362" y="1340" class="b">버전 고정 보고서 / 알림 이력은 확장</text><text x="1362" y="1370" class="sm">프로필 변경이 이전 보고서를 덮어쓰지 않음</text><text x="60" y="1450" class="h">실행 연결: Vercel 또는 Colab → 같은 총괄·도구·검증 코어 → 결과 저장·전달</text><text x="60" y="1490" class="sm">재조회: 부족한 자료만 수집 · 저장/재열기/PDF 생성만으로 새 외부 조회 없음 · 고정 자료 모드는 데이터 API 대신 자료 어댑터 사용</text><text x="60" y="1530" class="sm">RAG는 문서 근거 검색 선택안 · 멀티에이전트·MCP는 현재 필수 구성에서 제외 · PDF 원문 확보는 전용 API가 아닌 별도 경로</text><text x="60" y="1575" class="sm">근거: PRD v1.1 · agent-api-flow.md · 사용자 제공 Understand–Find–Verify–Explain–Alert 프로세스 / 초기 범위와 확장 제안을 구분</text></svg>
