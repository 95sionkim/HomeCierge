<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2940" viewBox="0 0 1600 2940" role="img" aria-labelledby="title desc">
<title id="title">HomeCierge 에이전트 전체 구성도</title><desc id="desc">Vercel 서비스와 Colab이 공통 에이전트 코어를 실행한다. 총괄 LLM, 기능 스킬, 도구, 검증 계산, 보고서와 저장소를 연결한다. RAG, 멀티에이전트, MCP는 선택적 확장이다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:#172b4d}.title{font-size:38px;font-weight:700}.sub{font-size:19px;fill:#52647c}.label{font-size:23px;font-weight:700}.body{font-size:18px}.small{font-size:17px;fill:#52647c}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.optional{stroke-dasharray:8 6}</style>
<rect width="1600" height="2940" fill="#f5f7fb"/>
<text x="60" y="65" class="title">HomeCierge · 에이전트 전체 구성도</text>
<text x="60" y="101" class="sub">서비스와 Colab이 같은 코어를 실행 · 2026-11-13 · 설계 제안 / 구현 완료를 뜻하지 않음</text><rect x="60" y="140" width="700" height="112" rx="16" fill="#eaf2ff" stroke="#cbd5e1" stroke-width="2"/><text x="84" y="176" class="label">서비스 실행 · Vercel API</text><text x="84" y="207" class="body">사용자 로그인·조건 입력·선택·변경 확인</text><text x="84" y="234" class="body">인증·입력 검증·요청 접수</text><rect x="800" y="140" width="740" height="112" rx="16" fill="#e8f6f3" stroke="#cbd5e1" stroke-width="2"/><text x="824" y="176" class="label">제출 실행 · Colab</text><text x="824" y="207" class="body">환경 설치 → 고정 자료 준비 → 에이전트 직접 실행 → 평가</text><text x="824" y="234" class="body">배포 서버 없이 재현 / 실제 LLM 모드와 회귀 검사 구분</text><path d="M410 252 V280 H800 V310" class="line"/><path d="M1170 252 V280 H800 V310" class="line"/><rect x="60" y="310" width="960" height="110" rx="16" fill="#eaf2ff" stroke="#cbd5e1" stroke-width="2"/><text x="84" y="346" class="label">LLM · 총괄 에이전트</text><text x="84" y="377" class="body">조건 확인 → 부족 근거 판단 → 도구 선택 → 충분성 검증</text><text x="84" y="404" class="body">추가 조회 / 사용자 질문 / 보류 / 종료 · 계산·권한·승인은 코드 통제</text><rect x="1080" y="310" width="460" height="110" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="1104" y="346" class="label">메모리 · 계정별 분리</text><text x="1104" y="377" class="body">채팅 / 승인된 공유 프로필</text><text x="1104" y="404" class="body">분석별 자금 / 보고서 스냅샷</text><path d="M1080 365 H1020" class="line"/><path d="M540 420 V455" class="line"/><rect x="60" y="455" width="960" height="105" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="84" y="491" class="label">워크플로 · 실행과 승인 통제</text><text x="84" y="522" class="body">고정 입력·자료 버전 / 분기·재시도·취소·부분 결과</text><text x="84" y="549" class="body">서비스: 영속 작업  ·  Colab: 같은 작업 계약의 실행기</text><rect x="1080" y="455" width="460" height="105" rx="16" fill="#fff5df" stroke="#cbd5e1" stroke-width="2"/><text x="1104" y="491" class="label">사용자 확인 지점</text><text x="1104" y="522" class="body">프로필 변경·기본 규칙 밖 조건 변경</text><text x="1104" y="549" class="body">미응답·거절·취소 ≠ 승인</text><path d="M1080 505 H1020" class="line"/><path d="M540 560 V600" class="line"/><rect x="60" y="600" width="1480" height="230" rx="18" fill="#edf1f7"/><text x="84" y="637" class="label">기능 스킬 · 별도 자율 에이전트가 아닌 호출 가능한 역할 단위</text><rect x="80" y="655" width="460" height="73" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="104" y="691" class="label">① 공고 탐색</text><text x="104" y="722" class="body">조건 충족·확인 필요 분리</text><rect x="560" y="655" width="460" height="73" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="584" y="691" class="label">② 공고·PDF 해석 · LLM 보조</text><text x="584" y="722" class="body">가격·옵션·납부·페이지 근거</text><rect x="1040" y="655" width="460" height="73" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="1064" y="691" class="label">③ 실거래 비교</text><text x="1064" y="722" class="body">단지·면적 대응·종류별 통계</text><rect x="80" y="738" width="460" height="73" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="104" y="774" class="label">④ 기초 자금표</text><text x="104" y="805" class="body">시점별 납부액·부족분</text><rect x="560" y="738" width="460" height="73" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="584" y="774" class="label">⑤ 법령 근거</text><text x="584" y="805" class="body">적용 시점·조항·미확인</text><rect x="1040" y="738" width="460" height="73" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="1064" y="774" class="label">⑥ 뉴스·출퇴근</text><text x="1064" y="805" class="body">뉴스 / 수단별 경로·실패</text><path d="M800 830 V865" class="line"/><rect x="60" y="865" width="1480" height="105" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="84" y="901" class="label">도구 계층 · API 커넥터와 문서 처리</text><text x="84" y="932" class="body">A 청약홈·PDF / B 실거래 / C 주소 / D K-apt / E 대장 / F 법령 / G 뉴스 / H 교통</text><text x="84" y="959" class="body">공통 공고 수집·선처리와 사용자 요청이 활용 · 출처별 허용 행위·입출력·계정 소유권 검사</text><path d="M800 970 V1005" class="line"/><rect x="60" y="1005" width="960" height="140" rx="16" fill="#e8f6f3" stroke="#cbd5e1" stroke-width="2"/><text x="84" y="1041" class="label">검증·계산 엔진 · 결정적 코드</text><text x="84" y="1072" class="body">원문·회차·값별 근거 점검 / 공급면적 ±5%·최근접 면적·최대 5단지</text><text x="84" y="1099" class="body">같은 동·읍·면 우선 → 전체 정상 0개일 때만 구 또는 시·군 확대</text><text x="84" y="1126" class="body">금액·거래 종류별 통계·자금 계산 / 오류·미확인을 정상 0개로 바꾸지 않음</text><rect x="1080" y="1005" width="460" height="140" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="1104" y="1041" class="label">저장·자료 어댑터</text><text x="1104" y="1072" class="body">서비스: Supabase DB·비공개 Storage</text><text x="1104" y="1099" class="body">재현: 로컬 파일 또는 SQLite</text><text x="1104" y="1126" class="body">사용자 업로드는 계정 소유 유지</text><path d="M1020 1075 H1080" class="line"/><path d="M540 1145 V1180" class="line"/><rect x="60" y="1180" width="960" height="110" rx="16" fill="#eaf2ff" stroke="#cbd5e1" stroke-width="2"/><text x="84" y="1216" class="label">구조화 결과 → ⑦ 보고서 스킬</text><text x="84" y="1247" class="body">LLM 설명 + 수치·조건·인용 일치 검사 → 화면·저장·PDF</text><text x="84" y="1274" class="body">독립적인 부분 결과 제공 / 재열기는 같은 버전, 재분석은 새 실행</text><rect x="1080" y="1180" width="460" height="110" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="1104" y="1216" class="label">결과 · 사용자에게 전달</text><text x="1104" y="1247" class="body">공고·주택형·조건·시점·출처</text><text x="1104" y="1274" class="body">확인값·보류 사유·다음 행동</text><path d="M1020 1235 H1080" class="line"/><text x="60" y="1360" class="label">선택적 확장 · 점선으로 구분 / 채택과 효과를 별도 검증</text><rect x="60" y="1390" width="470" height="160" rx="16" fill="#f5effc" stroke="#9976c7" stroke-width="2" stroke-dasharray="8 6"/><text x="84" y="1426" class="label">RAG · 근거 검색</text><text x="84" y="1457" class="body">문서 분할·버전/계정 필터</text><text x="84" y="1484" class="body">공고 페이지·법령 조항 검색</text><text x="84" y="1511" class="body">검색 근거 → LLM 문맥 → 인용 검증</text><text x="84" y="1538" class="body">벡터 검색은 필수 아님</text><rect x="565" y="1390" width="470" height="160" rx="16" fill="#f5effc" stroke="#9976c7" stroke-width="2" stroke-dasharray="8 6"/><text x="589" y="1426" class="label">멀티에이전트 · 전문 역할 위임</text><text x="589" y="1457" class="body">총괄 → 문서 / 법령 전문 에이전트</text><text x="589" y="1484" class="body">독립 검색·추론 → 구조화 결과 반환</text><text x="589" y="1511" class="body">도구 권한 제한·결과 검증</text><text x="589" y="1538" class="body">정확도·처리시간·비용 비교 후 분리</text><rect x="1070" y="1390" width="470" height="160" rx="16" fill="#f5effc" stroke="#9976c7" stroke-width="2" stroke-dasharray="8 6"/><text x="1094" y="1426" class="label">MCP · 도구의 표준 연결</text><text x="1094" y="1457" class="body">에이전트 클라이언트 → MCP 서버</text><text x="1094" y="1484" class="body">조회·검색·계산 도구 인터페이스</text><text x="1094" y="1511" class="body">기존 API·권한 검증은 유지</text><text x="1094" y="1538" class="body">Colab 채택 시 서버 실행 절차 포함</text><path d="M60 1470 H32 V1235 H60" class="line optional"/><path d="M800 1390 V1290" class="line optional"/><text x="60" y="1605" class="small">실선: 초기 구성 제안의 주요 흐름 · 점선: 선택적 확장 · 저장소 연결은 대표 경로만 표시</text><rect x="60" y="1640" width="1480" height="140" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="84" y="1676" class="label">재현·검수 기준</text><text x="84" y="1707" class="body">동일 코어·고정 자료·의존성 버전·프롬프트·도구 계약·평가 사례를 제출한다.</text><text x="84" y="1734" class="body">실제 LLM 실행과 무인증 대역 검사를 구분하며, Colab 검수로 서비스 Auth·RLS·영속 실행 검수를 대체하지 않는다.</text><text x="84" y="1761" class="body">근거: docs/agent-architecture.md · docs/colab-reproducibility.md · PRD v1.1</text><path d="M1540 1470 H1570 V920 H1540" class="line optional"/><text x="60" y="1855" class="title">API 호출 지도 · 어떤 자료를 언제 가져오는가</text><text x="60" y="1890" class="sub">저장소 probes.json 기준 · 호출 시점은 설계 제안 · 이번 작업에서 실호출하지 않음</text><rect x="60" y="1925" width="730" height="195" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="82" y="1958" class="label">A · 한국부동산원 청약홈 + 공식 PDF</text><text x="82" y="1988" class="small">언제: 공통 수집·갱신 / 탐색·상세 자료 누락 시</text><text x="82" y="2015" class="small">getAPTLttotPblancDetail / getRemndrLttotPblancDetail</text><text x="82" y="2042" class="small">getAPTLttotPblancMdl / getRemndrLttotPblancMdl</text><text x="82" y="2069" class="small">공고→주택형→공식 PDF: 호실·옵션·납부·페이지 점검</text><text x="82" y="2096" class="small">PDF는 별도 확보 경로 / 실패 시 업로드</text><rect x="810" y="1925" width="730" height="195" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="832" y="1958" class="label">B · 국토교통부 매매·분양권 실거래</text><text x="832" y="1988" class="small">언제: 선택 공고 분석·재분석에서 거래 자료가 부족할 때</text><text x="832" y="2015" class="small">getRTMSDataSvcAptTradeDev / getRTMSDataSvcSilvTrade</text><text x="832" y="2042" class="small">입력: LAWD_CD · DEAL_YMD · 페이지</text><text x="832" y="2069" class="small">출력: 거래금액·계약일·전용면적·해제·권리 구분</text><text x="832" y="2096" class="small">전용→공급면적 공식 대응은 별도 / 자체 거래 분리</text><rect x="60" y="2140" width="730" height="195" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="82" y="2173" class="label">C · 카카오 로컬 주소 검색</text><text x="82" y="2203" class="small">언제: 공고·후보의 주소/소속 지역 또는 목적지 확인</text><text x="82" y="2230" class="small">/v2/local/search/address.json</text><text x="82" y="2257" class="small">입력: query 주소 → 주소·법정동코드·좌표</text><text x="82" y="2284" class="small">확인 좌표의 직선거리는 자체 계산</text><text x="82" y="2311" class="small">카카오 주소 검색은 자동차 경로 API가 아님</text><rect x="810" y="2140" width="730" height="195" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="832" y="2173" class="label">D · K-apt 공동주택 목록 → 기본정보</text><text x="832" y="2203" class="small">언제: 후보 단지 식별·특성 근거가 필요할 때</text><text x="832" y="2230" class="small">getSigunguAptList4 → getAphusBassInfoV5</text><text x="832" y="2257" class="small">입력: sigunguCode → kaptCode</text><text x="832" y="2284" class="small">출력: 단지코드·주소·사용승인일·세대수</text><text x="832" y="2311" class="small">명칭만으로 연결 금지 / 목록 누락은 정상 0개 아님</text><rect x="60" y="2355" width="730" height="195" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="82" y="2388" class="label">E · 건축HUB 건축물대장 표제부</text><text x="82" y="2418" class="small">언제: K-apt 누락·주소·특성 충돌의 추가 근거 필요</text><text x="82" y="2445" class="small">BldRgstHubService/getBrTitleInfo</text><text x="82" y="2472" class="small">입력: sigunguCd · bjdongCd · bun/ji 등</text><text x="82" y="2499" class="small">출력: 동별 주소·용도·사용승인일·세대수</text><text x="82" y="2526" class="small">표제부를 세대 공급면적 대응 API로 취급하지 않음</text><rect x="810" y="2355" width="730" height="195" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="832" y="2388" class="label">F · 국가법령정보센터 검색 → 본문</text><text x="832" y="2418" class="small">언제: 선택 공고의 관련 조건·적용 시점을 확보한 뒤</text><text x="832" y="2445" class="small">DRF/lawSearch.do → DRF/lawService.do</text><text x="832" y="2472" class="small">입력: 법령 검색어 → 선택한 MST·efYd 시행 버전</text><text x="832" y="2499" class="small">출력: 관련 조항·부칙·별표 근거·미확인 예외</text><text x="832" y="2526" class="small">개인 자격 확정 금지 / RAG는 채택 시 근거 검색</text><rect x="60" y="2570" width="730" height="195" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="82" y="2603" class="label">G · NAVER API HUB 뉴스 검색</text><text x="82" y="2633" class="small">언제: 공고 지역·단지·검색 조건 확보 후</text><text x="82" y="2660" class="small">naverapihub.apigw.ntruss.com/search/v1/news</text><text x="82" y="2687" class="small">입력: query · display · sort</text><text x="82" y="2714" class="small">출력: 제목·발췌·원문 링크·게시시각</text><text x="82" y="2741" class="small">법령·뉴스는 비교와 병행 가능 / 전문 요약 별도 확인</text><rect x="810" y="2570" width="730" height="195" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="832" y="2603" class="label">H · ODsay 대중교통 길찾기</text><text x="832" y="2633" class="small">언제: 목적지·좌표·수단 조건 확보 후 조회 요청</text><text x="832" y="2660" class="small">api.odsay.com/v1/api/searchPubTransPathT</text><text x="832" y="2687" class="small">입력: SX/SY · EX/EY → 대중교통·연결 도보</text><text x="832" y="2714" class="small">오류·도보시간 미제공을 0분으로 표시하지 않음</text><text x="832" y="2741" class="small">자동차 경로: 초기 범위이나 제공자·API 미선정</text><rect x="60" y="2795" width="1480" height="100" rx="16" fill="#fff5df"/><text x="84" y="2828" class="label">재조회·재현 원칙</text><text x="84" y="2858" class="body">저장·재열기·PDF 생성은 새 외부 조회 없음 · 조건 변경은 부족한 범위만 조회 · 자금 변경은 자체 계산</text><text x="84" y="2884" class="small">Colab 고정 자료 모드는 API 대신 자료 어댑터 사용 · 공급면적 대응 경로 미정 · 상세: docs/agent-api-flow.md</text></svg>

