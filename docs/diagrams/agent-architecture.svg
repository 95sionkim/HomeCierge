<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1840" viewBox="0 0 1600 1840" role="img" aria-labelledby="title desc">
<title id="title">HomeCierge 에이전트 전체 구성도</title><desc id="desc">Vercel 서비스와 Colab이 공통 에이전트 코어를 실행한다. 총괄 LLM, 기능 스킬, 도구, 검증 계산, 보고서와 저장소를 연결한다. RAG, 멀티에이전트, MCP는 선택적 확장이다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:#172b4d}.title{font-size:38px;font-weight:700}.sub{font-size:19px;fill:#52647c}.label{font-size:23px;font-weight:700}.body{font-size:18px}.small{font-size:17px;fill:#52647c}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.optional{stroke-dasharray:8 6}</style>
<rect width="1600" height="1840" fill="#f5f7fb"/>
<text x="60" y="65" class="title">HomeCierge · 에이전트 전체 구성도</text>
<text x="60" y="101" class="sub">서비스와 Colab이 같은 코어를 실행 · 2026-11-13 · 설계 제안 / 구현 완료를 뜻하지 않음</text><rect x="60" y="140" width="700" height="112" rx="16" fill="#eaf2ff" stroke="#cbd5e1" stroke-width="2"/><text x="84" y="176" class="label">서비스 실행 · Vercel API</text><text x="84" y="207" class="body">사용자 로그인·조건 입력·선택·변경 확인</text><text x="84" y="234" class="body">인증·입력 검증·요청 접수</text><rect x="800" y="140" width="740" height="112" rx="16" fill="#e8f6f3" stroke="#cbd5e1" stroke-width="2"/><text x="824" y="176" class="label">제출 실행 · Colab</text><text x="824" y="207" class="body">환경 설치 → 고정 자료 준비 → 에이전트 직접 실행 → 평가</text><text x="824" y="234" class="body">배포 서버 없이 재현 / 실제 LLM 모드와 회귀 검사 구분</text><path d="M410 252 V280 H800 V310" class="line"/><path d="M1170 252 V280 H800 V310" class="line"/><rect x="60" y="310" width="960" height="110" rx="16" fill="#eaf2ff" stroke="#cbd5e1" stroke-width="2"/><text x="84" y="346" class="label">LLM · 총괄 에이전트</text><text x="84" y="377" class="body">의도·조건 해석 → 작업 계획 → 도구 선택 → 다음 행동 안내</text><text x="84" y="404" class="body">승인된 프로필·분석별 입력 사용 / 계산·권한·승인은 코드가 통제</text><rect x="1080" y="310" width="460" height="110" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="1104" y="346" class="label">메모리 · 계정별 분리</text><text x="1104" y="377" class="body">채팅 / 승인된 공유 프로필</text><text x="1104" y="404" class="body">분석별 자금 / 보고서 스냅샷</text><path d="M1080 365 H1020" class="line"/><path d="M540 420 V455" class="line"/><rect x="60" y="455" width="960" height="105" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="84" y="491" class="label">워크플로 · 실행과 승인 통제</text><text x="84" y="522" class="body">고정 입력·자료 버전 / 분기·재시도·취소·부분 결과</text><text x="84" y="549" class="body">서비스: 영속 작업  ·  Colab: 같은 작업 계약의 실행기</text><rect x="1080" y="455" width="460" height="105" rx="16" fill="#fff5df" stroke="#cbd5e1" stroke-width="2"/><text x="1104" y="491" class="label">사용자 확인 지점</text><text x="1104" y="522" class="body">프로필 변경·기본 규칙 밖 조건 변경</text><text x="1104" y="549" class="body">미응답·거절·취소 ≠ 승인</text><path d="M1080 505 H1020" class="line"/><path d="M540 560 V600" class="line"/><rect x="60" y="600" width="1480" height="230" rx="18" fill="#edf1f7"/><text x="84" y="637" class="label">기능 스킬 · 별도 자율 에이전트가 아닌 호출 가능한 역할 단위</text><rect x="80" y="655" width="460" height="73" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="104" y="691" class="label">① 공고 탐색</text><text x="104" y="722" class="body">조건 충족·확인 필요 분리</text><rect x="560" y="655" width="460" height="73" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="584" y="691" class="label">② 공고·PDF 해석 · LLM 보조</text><text x="584" y="722" class="body">가격·옵션·납부·페이지 근거</text><rect x="1040" y="655" width="460" height="73" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="1064" y="691" class="label">③ 실거래 비교</text><text x="1064" y="722" class="body">단지·면적 대응·종류별 통계</text><rect x="80" y="738" width="460" height="73" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="104" y="774" class="label">④ 기초 자금표</text><text x="104" y="805" class="body">시점별 납부액·부족분</text><rect x="560" y="738" width="460" height="73" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="584" y="774" class="label">⑤ 법령 근거</text><text x="584" y="805" class="body">적용 시점·조항·미확인</text><rect x="1040" y="738" width="460" height="73" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="1064" y="774" class="label">⑥ 뉴스·출퇴근</text><text x="1064" y="805" class="body">뉴스 / 수단별 경로·실패</text><path d="M800 830 V865" class="line"/><rect x="60" y="865" width="1480" height="105" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="84" y="901" class="label">도구 계층 · API 커넥터와 문서 처리</text><text x="84" y="932" class="body">청약홈 · 실거래 · 카카오 · K-apt · 건축물대장 · 법령 · 뉴스 · 교통 / 공식 PDF 확보·추출</text><text x="84" y="959" class="body">공통 공고 수집·선처리와 사용자 요청이 활용 · 출처별 허용 행위·입출력·계정 소유권 검사</text><path d="M800 970 V1005" class="line"/><rect x="60" y="1005" width="960" height="140" rx="16" fill="#e8f6f3" stroke="#cbd5e1" stroke-width="2"/><text x="84" y="1041" class="label">검증·계산 엔진 · 결정적 코드</text><text x="84" y="1072" class="body">원문·회차·값별 근거 점검 / 공급면적 ±5%·최근접 면적·최대 5단지</text><text x="84" y="1099" class="body">같은 동·읍·면 우선 → 전체 정상 0개일 때만 구 또는 시·군 확대</text><text x="84" y="1126" class="body">금액·거래 종류별 통계·자금 계산 / 오류·미확인을 정상 0개로 바꾸지 않음</text><rect x="1080" y="1005" width="460" height="140" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="1104" y="1041" class="label">저장·자료 어댑터</text><text x="1104" y="1072" class="body">서비스: Supabase DB·비공개 Storage</text><text x="1104" y="1099" class="body">재현: 로컬 파일 또는 SQLite</text><text x="1104" y="1126" class="body">사용자 업로드는 계정 소유 유지</text><path d="M1020 1075 H1080" class="line"/><path d="M540 1145 V1180" class="line"/><rect x="60" y="1180" width="960" height="110" rx="16" fill="#eaf2ff" stroke="#cbd5e1" stroke-width="2"/><text x="84" y="1216" class="label">구조화 결과 → ⑦ 보고서 스킬</text><text x="84" y="1247" class="body">LLM 설명 + 수치·조건·인용 일치 검사 → 화면·저장·PDF</text><text x="84" y="1274" class="body">독립적인 부분 결과 제공 / 재열기는 같은 버전, 재분석은 새 실행</text><rect x="1080" y="1180" width="460" height="110" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="1104" y="1216" class="label">결과 · 사용자에게 전달</text><text x="1104" y="1247" class="body">공고·주택형·조건·시점·출처</text><text x="1104" y="1274" class="body">확인값·보류 사유·다음 행동</text><path d="M1020 1235 H1080" class="line"/><text x="60" y="1360" class="label">선택적 확장 · 점선으로 구분 / 채택과 효과를 별도 검증</text><rect x="60" y="1390" width="470" height="160" rx="16" fill="#f5effc" stroke="#9976c7" stroke-width="2" stroke-dasharray="8 6"/><text x="84" y="1426" class="label">RAG · 근거 검색</text><text x="84" y="1457" class="body">문서 분할·버전/계정 필터</text><text x="84" y="1484" class="body">공고 페이지·법령 조항 검색</text><text x="84" y="1511" class="body">검색 근거 → LLM 문맥 → 인용 검증</text><text x="84" y="1538" class="body">벡터 검색은 필수 아님</text><rect x="565" y="1390" width="470" height="160" rx="16" fill="#f5effc" stroke="#9976c7" stroke-width="2" stroke-dasharray="8 6"/><text x="589" y="1426" class="label">멀티에이전트 · 전문 역할 위임</text><text x="589" y="1457" class="body">총괄 → 문서 / 법령 전문 에이전트</text><text x="589" y="1484" class="body">독립 검색·추론 → 구조화 결과 반환</text><text x="589" y="1511" class="body">도구 권한 제한·결과 검증</text><text x="589" y="1538" class="body">정확도·처리시간·비용 비교 후 분리</text><rect x="1070" y="1390" width="470" height="160" rx="16" fill="#f5effc" stroke="#9976c7" stroke-width="2" stroke-dasharray="8 6"/><text x="1094" y="1426" class="label">MCP · 도구의 표준 연결</text><text x="1094" y="1457" class="body">에이전트 클라이언트 → MCP 서버</text><text x="1094" y="1484" class="body">조회·검색·계산 도구 인터페이스</text><text x="1094" y="1511" class="body">기존 API·권한 검증은 유지</text><text x="1094" y="1538" class="body">Colab 채택 시 서버 실행 절차 포함</text><path d="M60 1470 H32 V1235 H60" class="line optional"/><path d="M800 1390 V1290" class="line optional"/><text x="60" y="1605" class="small">실선: 초기 구성 제안의 주요 흐름 · 점선: 선택적 확장 · 저장소 연결은 대표 경로만 표시</text><rect x="60" y="1640" width="1480" height="140" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="84" y="1676" class="label">재현·검수 기준</text><text x="84" y="1707" class="body">동일 코어·고정 자료·의존성 버전·프롬프트·도구 계약·평가 사례를 제출한다.</text><text x="84" y="1734" class="body">실제 LLM 실행과 무인증 대역 검사를 구분하며, Colab 검수로 서비스 Auth·RLS·영속 실행 검수를 대체하지 않는다.</text><text x="84" y="1761" class="body">근거: docs/agent-architecture.md · docs/colab-reproducibility.md · PRD v1.1</text><path d="M1540 1470 H1570 V920 H1540" class="line optional"/></svg>

