<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1860" viewBox="0 0 2200 1860" role="img" aria-labelledby="title desc">
<title id="title">HomeCierge 전체 에이전트 시스템 구성도</title><desc id="desc">사용자와 Vercel 및 Colab 실행 경로, 총괄 LLM 에이전트, 탐색 비교 설명 도구와 외부 API, 검증 엔진, Supabase 메모리, 결과와 알림 재탐색 루프를 연결한다. 알림과 주기 실행은 확장 설계다.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7a8ca5"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:#19304e}.title{font-size:40px;font-weight:700}.h{font-size:25px;font-weight:700}.b{font-size:21px}.sm{font-size:18px;fill:#536983}.tag{font-size:18px;font-weight:700;fill:#316cca}.line{fill:none;stroke:#7a8ca5;stroke-width:2;marker-end:url(#a)}.dash{stroke-dasharray:8 7}.reverse{marker-start:url(#a)}</style>
<rect width="2200" height="1860" fill="#f5f8fc"/><text x="50" y="65" class="title">HomeCierge · 전체 에이전트 시스템 구성도</text><text x="50" y="105" class="b">구매조건을 이해하고, 근거를 조회·검증해 설명하며, 확장 시 새 기회를 다시 탐색한다.</text><text x="50" y="141" class="sm">2026-11-13 · 설계 제안 / 구현 완료 아님 · 실선: 기본 처리 · 점선: 지속 탐색·알림 확장</text><rect x="450" y="185" width="1300" height="95" rx="16" fill="#edf3ff" stroke="#cedbea" stroke-width="2"/><text x="472" y="223" class="h">사용자 · 구매조건 입력 / 공고·주택형 선택 / 변경 확인</text><text x="472" y="260" class="sm">예산·지역·면적·입주 시점 · 분석별 자금 · 목적지 · 결과 확인</text><rect x="450" y="325" width="630" height="115" rx="16" fill="#eaf3ff" stroke="#cedbea" stroke-width="2"/><text x="472" y="363" class="h">서비스 경로 · Vercel API</text><text x="472" y="400" class="sm">Supabase Auth 인증 → 입력 검증 → 작업 접수</text><text x="472" y="430" class="sm">사용자 JWT·RLS 유지 / 긴 작업은 별도 실행기</text><rect x="1120" y="325" width="630" height="115" rx="16" fill="#e7f5ef" stroke="#cedbea" stroke-width="2"/><text x="1142" y="363" class="h">제출 경로 · Colab</text><text x="1142" y="400" class="sm">같은 에이전트 코어·프롬프트·도구 계약 직접 실행</text><text x="1142" y="430" class="sm">고정 자료·로컬 저장 / 실제 LLM과 회귀 대역 구분</text><path d="M775 280 V325" class="line"/><path d="M1435 280 V325" class="line"/><path d="M775 440 V470 H1100 V495" class="line"/><path d="M1435 440 V470 H1100 V495" class="line"/><rect x="450" y="495" width="1300" height="195" rx="16" fill="#def2ed" stroke="#cedbea" stroke-width="2"/><text x="472" y="533" class="h">LLM · HomeCierge 총괄 에이전트 + 상태 기반 워크플로</text><text x="472" y="570" class="sm">Understand: 요청·승인된 조건 확인 → Find: 부족 근거와 필요한 도구 선택</text><text x="472" y="600" class="sm">Verify: 코드 검증 결과 확인 → Explain: 근거·주의·다음 행동 정리 → Alert: 확장 시 알림 요청</text><text x="472" y="630" class="sm">추가 조회 / 사용자 질문 / 부분 제공 / 해당 판정 보류 / 종료를 구조화된 상태로 관리</text><text x="472" y="660" class="sm">서버가 도구 권한·사용자 승인·재시도·취소를 통제 · 단계별 스킬 ≠ 별도 멀티에이전트</text><rect x="50" y="495" width="350" height="195" rx="16" fill="#fff5de" stroke="#cedbea" stroke-width="2"/><text x="72" y="533" class="h">승인·입력 경계</text><text x="72" y="570" class="sm">공유 프로필 변경은 명시적 승인</text><text x="72" y="600" class="sm">분석 조건 변경과 승인 분리</text><text x="72" y="630" class="sm">상세 자금은 분석별 저장</text><text x="72" y="660" class="sm">미응답·거절·취소 ≠ 승인</text><path d="M400 590 H450" class="line"/><rect x="1800" y="495" width="350" height="195" rx="16" fill="#f5effc" stroke="#9b85c5" stroke-width="2" stroke-dasharray="8 7"/><text x="1822" y="533" class="h">Scheduler · 확장</text><text x="1822" y="570" class="sm">동의한 주기 / 변경 이벤트</text><text x="1822" y="600" class="sm">신규·정정 공고 감지</text><text x="1822" y="630" class="sm">Find 재실행 → 필요한 검증</text><text x="1822" y="660" class="sm">주기·배치 런타임은 미정</text><path d="M1800 585 H1750" class="line dash"/><text x="450" y="735" class="tag">기능 스킬 → 검증된 도구 호출 → 구조화 결과 반환</text><path d="M655 690 V765" class="line reverse"/><path d="M1100 690 V765" class="line reverse"/><path d="M1545 690 V765" class="line reverse"/><rect x="450" y="765" width="410" height="350" rx="16" fill="#fff" stroke="#cedbea" stroke-width="2"/><text x="472" y="803" class="h">Find · 공고 탐색·PDF</text><text x="472" y="840" class="sm">호출: 수집·갱신 / 누락 보완</text><text x="472" y="870" class="sm">청약홈 공고 2종 → 주택형 2종</text><text x="472" y="900" class="sm">공식 상세 페이지 → PDF 확보</text><text x="472" y="930" class="sm">실패 시 업로드 · LLM 추출 보조</text><text x="472" y="960" class="sm">같은 회차·정정·호실·옵션 점검</text><text x="472" y="990" class="tag">→ 충족 목록 / 확인 필요 목록</text><text x="472" y="1020" class="tag">→ 가격·납부 일정·페이지 근거</text><text x="472" y="1050" class="sm">조건 미확인 공고를 충족으로 추정 금지</text><rect x="895" y="765" width="410" height="350" rx="16" fill="#fff" stroke="#cedbea" stroke-width="2"/><text x="917" y="803" class="h">Verify · 비교·자금</text><text x="917" y="840" class="sm">호출: 공고·주택형 선택 후 분석</text><text x="917" y="870" class="sm">매매·분양권/입주권 실거래 조회</text><text x="917" y="900" class="sm">주소·단지 식별·공급면적 대응</text><text x="917" y="930" class="sm">지역·계약월·페이지 완전성 확인</text><text x="917" y="960" class="sm">가격·통계·납부 부족분은 코드 계산</text><text x="917" y="990" class="tag">→ 주변 최대 5단지·종류별 통계</text><text x="917" y="1020" class="tag">→ 자체 거래 별도·자금 부족분</text><text x="917" y="1050" class="sm">공급면적 대응 공식 자료 경로 미정</text><rect x="1340" y="765" width="410" height="350" rx="16" fill="#fff" stroke="#cedbea" stroke-width="2"/><text x="1362" y="803" class="h">Explain · 근거·보고서</text><text x="1362" y="840" class="sm">호출: 공고 조건·지역 확보 후</text><text x="1362" y="870" class="sm">법령 검색 → 적용 버전 본문</text><text x="1362" y="900" class="sm">지역 뉴스 / 목적지 확인 후 경로</text><text x="1362" y="930" class="sm">RAG: 채택 시 PDF·조항 근거 검색</text><text x="1362" y="960" class="sm">LLM 설명 → 수치·조건·인용 대조</text><text x="1362" y="990" class="tag">→ 출처·가정·미확인·다음 행동</text><text x="1362" y="1020" class="tag">→ 동일 결과의 화면·저장·PDF</text><text x="1362" y="1050" class="sm">자동차 경로 API 제공자 미선정</text><rect x="50" y="765" width="350" height="350" rx="16" fill="#edf3ff" stroke="#cedbea" stroke-width="2"/><text x="72" y="803" class="h">Memory · 저장 어댑터</text><text x="72" y="840" class="sm">서비스: Supabase</text><text x="72" y="870" class="sm">DB · Auth · 비공개 Storage</text><text x="72" y="900" class="sm">채팅 / 승인된 프로필</text><text x="72" y="930" class="sm">분석 입력·자금 / 실행 상태</text><text x="72" y="960" class="sm">자료·출처·보고서 스냅샷</text><text x="72" y="990" class="sm">사용자 업로드는 계정별 분리</text><text x="72" y="1020" class="sm">Colab: 로컬 파일 / SQLite</text><text x="72" y="1050" class="sm">알림 이력·수신 동의는 확장</text><path d="M400 830 H425 V650 H450" class="line reverse"/><rect x="1800" y="765" width="350" height="350" rx="16" fill="#f5effc" stroke="#9b85c5" stroke-width="2" stroke-dasharray="8 7"/><text x="1822" y="803" class="h">Alert · 확장</text><text x="1822" y="840" class="sm">조건을 충족하는 신규/변경 기회</text><text x="1822" y="870" class="sm">필요한 검증·근거 설명 완료</text><text x="1822" y="900" class="sm">수신 동의·삭제 상태 재확인</text><text x="1822" y="930" class="sm">중복 키·이전 발송 이력 검사</text><text x="1822" y="960" class="sm">Notification Adapter로 발송</text><text x="1822" y="990" class="sm">채널·발송 API는 미정</text><text x="1822" y="1020" class="sm">정정 재알림·해지·재시도 필요</text><text x="1822" y="1050" class="sm">실제 스케줄·알림은 미활성화</text><path d="M1975 765 V690" class="line dash"/><rect x="450" y="1160" width="410" height="230" rx="16" fill="#edf2f9" stroke="#cedbea" stroke-width="2"/><text x="472" y="1198" class="h">외부 API / 문서 확보</text><text x="472" y="1235" class="sm">getAPTLttotPblancDetail</text><text x="472" y="1265" class="sm">getRemndrLttotPblancDetail</text><text x="472" y="1295" class="sm">getAPTLttotPblancMdl</text><text x="472" y="1325" class="sm">getRemndrLttotPblancMdl</text><text x="472" y="1355" class="sm">PDF는 전용 API가 아닌 첨부 경로</text><path d="M655 1115 V1160" class="line reverse"/><rect x="895" y="1160" width="410" height="230" rx="16" fill="#edf2f9" stroke="#cedbea" stroke-width="2"/><text x="917" y="1198" class="h">외부 API / 단지 보완</text><text x="917" y="1235" class="sm">getRTMSDataSvcAptTradeDev</text><text x="917" y="1265" class="sm">getRTMSDataSvcSilvTrade</text><text x="917" y="1295" class="sm">카카오 /v2/local/search/address.json</text><text x="917" y="1325" class="sm">getSigunguAptList4 → getAphusBassInfoV5</text><text x="917" y="1355" class="sm">건축HUB getBrTitleInfo</text><path d="M1100 1115 V1160" class="line reverse"/><rect x="1340" y="1160" width="410" height="230" rx="16" fill="#edf2f9" stroke="#cedbea" stroke-width="2"/><text x="1362" y="1198" class="h">외부 API / 근거 조회</text><text x="1362" y="1235" class="sm">법령 lawSearch.do → lawService.do</text><text x="1362" y="1265" class="sm">NAVER API HUB /search/v1/news</text><text x="1362" y="1295" class="sm">ODsay searchPubTransPathT</text><text x="1362" y="1325" class="sm">법령·뉴스는 비교와 병행 가능</text><text x="1362" y="1355" class="sm">경로는 목적지·좌표 조건 확보 후</text><path d="M1545 1115 V1160" class="line reverse"/><rect x="450" y="1440" width="1300" height="130" rx="16" fill="#fff5de" stroke="#cedbea" stroke-width="2"/><text x="472" y="1478" class="h">공통 검증 게이트 → 버전이 고정된 분석 결과</text><text x="472" y="1515" class="sm">분양가+필수 옵션 / 공급면적 ±5%·최근접 면적 / 전체 정상 0개에서만 지역 확대 / 종류별 통계</text><text x="472" y="1545" class="sm">누락·충돌·오류를 정상 0개로 바꾸지 않음 · 독립 결과 제공 · 가격 차이는 보장된 수익이 아님</text><path d="M655 1390 V1415 H1100 V1440" class="line"/><path d="M1545 1390 V1415 H1100 V1440" class="line"/><path d="M1100 1390 V1440" class="line"/><path d="M450 1505 H425 V1045 H400" class="line"/><path d="M1750 1505 H1775 V995 H1800" class="line dash"/><rect x="450" y="1620" width="1300" height="105" rx="16" fill="#e7f5ef" stroke="#cedbea" stroke-width="2"/><text x="472" y="1658" class="h">결과 전달 · 사용자 판단 지원</text><text x="472" y="1695" class="sm">공고 후보·가격 비교·시점별 자금 부족·근거·주의사항 / 저장·재열기·PDF는 같은 결과 버전</text><path d="M1100 1570 V1620" class="line"/><path d="M1750 1672 H2175 V230 H1750" class="line"/><text x="1810" y="1638" class="tag">화면·채팅으로 전달</text><path d="M2150 930 H2175" class="line dash"/><text x="50" y="1780" class="sm">운영 원칙: 부족한 자료만 조회 · 단순 저장/재열기 시 외부 데이터 재조회 없음 · 출처별 저장·LLM 입력·내보내기 허용 확인</text><text x="50" y="1817" class="sm">지속 탐색·알림은 목표 흐름의 확장 설계 · 멀티에이전트·MCP는 필수 구성에서 제외 · 세부 API 계약: docs/agent-api-flow.md</text></svg>
